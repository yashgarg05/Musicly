<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicly - Tune in with music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/logo.png">
</head>
<body>
    <nav>
        <ul>
            <li class="logo">
                <img src="assets/logo.png" alt="Musicly logo">
                <span>Musicly</span>
            </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <main class="container">
        <section class="songlist" aria-labelledby="songListTitle">
            <div class="songlist-heading">
                <h1 id="songListTitle">Some Good Songs</h1>
                <button
                    class="songlist-toggle"
                    id="songListToggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="songItemContainer"
                >Hide songs</button>
            </div>

            <div class="songItemContainer" id="songItemContainer">
                <label class="songSearchLabel" for="songSearch">Search songs</label>
                <input
                    class="songSearch"
                    id="songSearch"
                    type="search"
                    placeholder="Type a song name..."
                >
                <div id="songsContainer"></div>
            </div>
        </section>
        <div class="songBanner"></div>
    </main>

    <template id="songItemTemplate">
        <div class="songItem">
            <img class="cover" alt="">
            <span class="songname"></span>
            <span class="songlistplay">
                <span class="timestamp">--:--</span>
                <img class="playbtn" src="assets/play-button.png" alt="Play">
            </span>
        </div>
    </template>

    <footer class="bottom">
        <div class="timeInfo">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" min="0" max="100" value="0">
            <span id="totalTime">0:00</span>
        </div>

        <div class="songInfo">
            <img src="covers/pokemon.jpg" alt="Current song" id="masterCover">
            <div>
                <span id="masterName">Pokemon - Hindi</span>
                <small id="playerStatus">Paused</small>
            </div>
        </div>

        <div class="icons">
            <button id="shuffle" type="button" title="Shuffle">
                <img src="assets/shuffle.png" alt="Shuffle">
            </button>
            <button id="backward" type="button" title="Previous song">
                <img src="assets/next-button.png" alt="Previous">
            </button>
            <button id="masterPlay" type="button" title="Play">
                <img src="assets/play-button.png" alt="Play">
            </button>
            <button id="forward" type="button" title="Next song">
                <img src="assets/next-button.png" alt="Next">
            </button>
            <button id="repeat" type="button" title="Repeat">
                <img src="assets/repeat.png" alt="Repeat">
            </button>
        </div>

        <div class="volumeControl">
            <button id="muteButton" type="button" title="Mute">
                <img src="assets/volume.png" alt="Volume">
            </button>
            <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1">
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
