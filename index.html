<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Musicly - Tune in with music</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <link rel="icon" href="assets/logo.png">

</head>


<body>

    <!-- Navbar -->

    <nav>

        <ul>

            <li class="logo">

                <img
                    src="assets/logo.png"
                    alt="Spotify logo"
                >

                <span>Musicly</span>

            </li>

            <li>Home</li>

            <li>About</li>

        </ul>

    </nav>


    <!-- Main content -->

    <div class="container">

        <div class="songlist">

            <h1>My Favourite Songs</h1>


            <div class="songItemContainer">


                <!-- Song 1 -->

                <div class="songItem">

                    <img
                        src="covers/pokemon.jpg"
                        alt="Pokemon cover"
                        class="cover"
                    >

                    <span class="songname">
                        Pokemon - Hindi
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>


                <!-- Song 2 -->

                <div class="songItem">

                    <img
                        src="covers/challa.jpg"
                        alt="Challa cover"
                        class="cover"
                    >

                    <span class="songname">

                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>


                <!-- Song 3 -->

                <div class="songItem">

                    <img
                        src="covers/dil-dhadak.jpg"

                        class="cover"
                    >

                    <span class="songname">
                        Dil Dhadakne Do
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>


                <!-- Song 4 -->

                <div class="songItem">

                    <img
                        src="covers/dil-diyaan-gallan.jpg"
                        alt="Dil Diyaan Gallan cover"
                        class="cover"
                    >

                    <span class="songname">
                        Dil Diyaan Gallan
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>


                <!-- Song 5 -->

                <div class="songItem">

                    <img
                        src="covers/harkisi.jpg"
                        alt="Har Kisi Ko cover"
                        class="cover"
                    >

                    <span class="songname">
                        Har Kisi Ko
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>


                <!-- Song 6 -->

                <div class="songItem">

                    <img
                        src="covers/kaabil.jpg"
                        alt="Kaabil Hoon cover"
                        class="cover"
                    >

                    <span class="songname">
                        Kaabil Hoon
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"

                    </span>

                </div>


                <!-- Song 7 -->

                <div class="songItem">

                    <img

                    >

                    <span class="songname">

                    <span class="songlistplay">

                <!-- Song 8 -->

                <div class="songItem">

                    <img
                        src="covers/kyamuje.jpg"

                    >

                    <span class="songname">

                    <span class="songlistplay">

                            class="playbtn"

                        >

                    </span>

                </div>


                <!-- Song 9 -->

                <div class="songItem">

                    <img
                        src="covers/mexico.jpg"
                        alt="Mexico cover"
                        class="cover"
                    >

                    <span class="songname">
                        Mexico
                    </span>

                    <span class="songlistplay">

                        <span class="timestamp">
                            --:--
                        </span>

                        <img
                            class="playbtn"
                            src="assets/play-button.png"
                            alt="Play"
                        >

                    </span>

                </div>

            </div>

        </div>


        <div class="songBanner"></div>

    </div>


    <!-- Bottom music player -->

    <div class="bottom">


        <!-- Progress -->

        <div class="timeInfo">

            <span id="currentTime">
                0:00
            </span>

            <input
                type="range"
                id="progressBar"
                min="0"
                max="100"
                value="0"
            >

            <span id="totalTime">
                0:00
            </span>

        </div>


        <!-- Song information -->

        <div class="songInfo">

            <img
                src="covers/pokemon.jpg"
                alt="Current song"
                id="masterCover"
            >

            <div>

                <span id="masterName">
                    Pokemon - Hindi
                </span>

                <small id="playerStatus">
                    Paused
                </small>

            </div>

        </div>


        <!-- Main controls -->

        <div class="icons">


            <button
                id="shuffle"
                title="Shuffle"
            >

                <img
                    src="assets/shuffle.png"
                    alt="Shuffle"
                >

            </button>


            <button
                id="backward"
                title="Previous song"
            >

                <img
                    src="assets/next-button.png"
                    alt="Previous"
                >

            </button>


            <button
                id="masterPlay"
                title="Play"
            >

                <img
                    src="assets/play-button.png"
                    alt="Play"
                >

            </button>


            <button
                id="forward"
                title="Next song"
            >

                <img
                    src="assets/next-button.png"
                    alt="Next"
                >

            </button>


            <button
                id="repeat"
                title="Repeat"
            >

                <img
                    src="assets/repeat.png"
                    alt="Repeat"
                >

            </button>

        </div>


        <!-- Volume -->

        <div class="volumeControl">

            <button
                id="muteButton"
                title="Mute"
            >

                <img
                    src="assets/volume.png"
                    alt="Volume"
                >

            </button>

            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
